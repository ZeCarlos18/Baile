services:
  # Backend (Socket.IO + Express)
  - type: web
    name: baralho-backend
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # Frontend (React + Vite)
  - type: web
    name: baralho-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: baralho-backend
          property: url
